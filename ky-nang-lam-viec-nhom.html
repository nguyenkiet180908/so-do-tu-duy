<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kỹ năng làm việc nhóm – Chương 1</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        :root {
            --paper: #fbf8f1;
            --paper-dot: #e4ddcf;
            --ink: #2b2a28;
            --ink-soft: #5b5750;
            --terracotta: #cf8a6c;
            --highlight: #ffe46b;
            --sticky: #fff1a1;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--paper);
            color: var(--ink);
            font-family: 'Patrick Hand', 'Comic Sans MS', cursive;
        }

        #viewport {
            position: absolute;
            inset: 0;
            overflow: auto;
            cursor: grab;
            background-color: var(--paper);
            background-image: radial-gradient(var(--paper-dot) 1.3px, transparent 1.3px);
            background-size: 24px 24px;
        }
        #viewport.panning { cursor: grabbing; user-select: none; }

        #sizer { position: relative; margin: 0 auto; }

        #sheet {
            position: absolute;
            top: 0;
            left: 0;
            width: max-content;
            padding: 48px 64px 90px;
            transform-origin: 0 0;
        }

        #branches {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .sheet-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 80px;
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
        }

        .name-card {
            background: #fff;
            border: 4px solid var(--ink);
            border-radius: 14px 10px 16px 9px;
            padding: 9px;
            box-shadow: 14px 12px 0 var(--terracotta);
            transform: rotate(-1.2deg);
        }
        .name-card-inner {
            background: var(--terracotta);
            border: 3px solid var(--ink);
            border-radius: 6px 9px 5px 8px;
            padding: 14px 30px 18px 20px;
            font-size: 28px;
            line-height: 1.35;
        }
        .name-card-inner b { font-weight: normal; }

        .sticky {
            position: relative;
            width: 620px;
            background: var(--sticky);
            padding: 30px 30px 24px 34px;
            transform: rotate(1.2deg);
            box-shadow: 0 14px 18px -12px rgba(43, 42, 40, 0.45);
            border-radius: 2px 2px 18px 2px;
        }
        .sticky::before {
            content: "";
            position: absolute;
            top: -14px;
            left: 50%;
            width: 130px;
            height: 30px;
            margin-left: -65px;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(0, 0, 0, 0.06);
            transform: rotate(-2.5deg);
        }
        .sticky h2 {
            margin: 0 0 10px;
            font-weight: normal;
            font-size: 28px;
        }
        .sticky ol {
            margin: 0;
            padding-left: 26px;
            font-size: 17.5px;
            line-height: 1.38;
        }
        .sticky li { margin-bottom: 3px; }
        .sticky li::marker { color: #b5642f; }
        .sticky b { font-weight: normal; color: #b5642f; }

        .map {
            display: flex;
            align-items: center;
            gap: 150px;
            position: relative;
            z-index: 1;
        }

        .side {
            display: flex;
            flex-direction: column;
            gap: 60px;
        }

        .branch {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 64px;
        }
        .side.right .branch { flex-direction: row-reverse; }
        .branch.collapsed:not(.peek) .cats { display: none; }

        .cats {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }
        .side.left .cats { align-items: flex-end; }
        .side.right .cats { align-items: flex-start; }

        .cat-row {
            display: flex;
            align-items: center;
            gap: 50px;
        }
        .side.right .cat-row { flex-direction: row-reverse; }

        .leaves {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 360px;
        }
        .side.left .leaves { align-items: flex-end; text-align: right; }
        .side.right .leaves { align-items: flex-start; text-align: left; }

        .sec {
            position: relative;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 0 8px 5px;
            border-bottom: 5px solid currentColor;
            border-radius: 0 0 3px 3px;
            white-space: nowrap;
            cursor: pointer;
        }
        .side.right .sec { flex-direction: row-reverse; }
        .side.left .sec-text { text-align: right; }
        .sec:hover .sec-name { text-decoration: underline wavy; text-decoration-thickness: 1px; text-underline-offset: 5px; }

        .doodle {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            margin-bottom: 2px;
        }
        .doodle * {
            fill: none;
            stroke: currentColor;
            stroke-width: 2.3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .doodle .tint { fill: currentColor; fill-opacity: 0.16; }
        .doodle .dash { stroke-dasharray: 3 4.5; }

        .sec-no {
            font-size: 22px;
            opacity: 0.8;
            margin-right: 6px;
        }
        .sec-name { font-size: 32px; line-height: 1; }
        .sec-sub {
            display: block;
            font-size: 15px;
            color: var(--ink-soft);
            margin-top: 4px;
        }

        .knob {
            position: absolute;
            bottom: -13px;
            width: 21px;
            height: 21px;
            border: 2.5px solid currentColor;
            border-radius: 50%;
            background: var(--paper);
            font-size: 18px;
            line-height: 14px;
            text-align: center;
        }
        .side.left .knob { left: -12px; }
        .side.right .knob { right: -12px; }

        .cat {
            font-size: 21px;
            padding: 0 6px 2px;
            border-bottom: 3px solid currentColor;
            white-space: nowrap;
        }

        .leaf {
            font-size: 16.5px;
            line-height: 1.3;
            color: var(--ink);
            padding: 1px 5px 2px;
            border-bottom: 2px solid;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }
        .leaf:hover .leaf-text { background: rgba(0, 0, 0, 0.04); border-radius: 4px; }
        .leaf b { font-weight: normal; }
        .leaf.done .leaf-text {
            text-decoration: line-through;
            text-decoration-thickness: 1.5px;
            opacity: 0.5;
        }
        .leaf.done::after { content: " ✓"; font-size: 19px; }
        .leaf.match .leaf-text {
            background: linear-gradient(transparent 45%, var(--highlight) 45%, var(--highlight) 92%, transparent 92%);
        }
        .leaf.dim, .cat.dim { opacity: 0.22; }

        .hub {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 26px 40px 28px;
            background: #fff6d8;
            border: 3.5px solid var(--ink);
            border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
            transform: rotate(-1deg);
            box-shadow: 7px 8px 0 rgba(43, 42, 40, 0.12);
        }
        .hub .doodle { width: 64px; height: 64px; color: var(--ink); }
        .hub .doodle .tint { fill: #ffd84d; fill-opacity: 0.7; }
        .hub-title { font-size: 38px; line-height: 1.05; }
        .hub-sub { font-size: 26px; color: var(--ink-soft); margin-top: 8px; }

        body.intro .hub,
        body.intro .sec,
        body.intro .cat,
        body.intro .leaf { opacity: 0; }

        .pop { animation: pop 0.45s ease-out both; }
        .hub.pop { animation-name: hubPop; animation-duration: 0.6s; }
        .grow-l { animation: growL 0.55s ease-out both; }
        .grow-r { animation: growR 0.55s ease-out both; }

        @keyframes pop {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: none; }
        }
        @keyframes hubPop {
            from { opacity: 0; transform: rotate(-1deg) scale(0.85); }
            to { opacity: 1; transform: rotate(-1deg) scale(1); }
        }
        @keyframes growL {
            from { clip-path: inset(0 0 0 100%); }
            to { clip-path: inset(0 0 0 0); }
        }
        @keyframes growR {
            from { clip-path: inset(0 100% 0 0); }
            to { clip-path: inset(0 0 0 0); }
        }

        .toolbar {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 6px 8px;
            background: #fff;
            border: 2.5px solid var(--ink);
            border-radius: 12px 8px 13px 9px;
            box-shadow: 4px 4px 0 rgba(43, 42, 40, 0.15);
            font-size: 17px;
        }
        .toolbar button {
            font: inherit;
            background: none;
            border: none;
            color: var(--ink);
            min-width: 32px;
            height: 32px;
            padding: 0 8px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }
        .toolbar button:hover { background: #f1ece1; }
        .toolbar .sep {
            width: 1.5px;
            height: 22px;
            background: #d8d1c3;
            margin: 0 4px;
        }
        .toolbar input {
            font: inherit;
            width: 170px;
            border: none;
            border-bottom: 2px dashed #c9c1b1;
            background: transparent;
            outline: none;
            padding: 2px 4px;
            color: var(--ink);
        }
        .toolbar input:focus { border-bottom-color: var(--ink); }
        #zoom-text { min-width: 46px; text-align: center; color: var(--ink-soft); }
        #progress-text { color: var(--ink-soft); padding: 0 4px; white-space: nowrap; }

        .tip {
            position: fixed;
            left: 18px;
            bottom: 20px;
            z-index: 20;
            font-size: 16px;
            color: #8c857a;
        }

        @media (max-width: 1150px) { .tip { display: none; } }
        @media (max-width: 900px) {
            .toolbar { left: 12px; right: 12px; bottom: 12px; flex-wrap: wrap; justify-content: center; }
            .toolbar input { width: 120px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .pop, .grow-l, .grow-r { animation: none !important; }
        }

        @media print {
            .toolbar, .tip { display: none !important; }
            html, body { overflow: visible; height: auto; }
            #viewport { position: static; overflow: visible; background-image: none; }
            #sheet { transform: scale(0.5) !important; }
            .knob { display: none; }
        }
    </style>
</head>

        const STORAGE_KEY = "kn_lvn_c1_progress";
        const COLLAPSE_KEY = "kn_lvn_c1_collapsed";
        const MIN_SCALE = 0.3;
        const MAX_SCALE = 1.5;
        const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        let completionMap = {};
        let collapsed = {};
        let currentScale = 1;

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll("[data-student]").forEach(el => {
                el.textContent = STUDENT[el.dataset.student] || "";
            });
            document.getElementById("key-points").innerHTML = KEY_POINTS.map(p => `<li>${p}</li>`).join("");
            document.getElementById("hub-doodle").innerHTML = DOODLES.people;

            completionMap = readStore(STORAGE_KEY);
            collapsed = readStore(COLLAPSE_KEY);
            renderMindmap();
            setupPanAndZoom();

            const start = () => {
                syncSizer();
                fitToScreen();
                drawBranches({ anim: REDUCED_MOTION ? null : "all" });
                document.body.classList.remove("intro");
            };
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(start);
            else setTimeout(start, 200);

            window.addEventListener("resize", () => { syncSizer(); drawBranches(); });
        });

        function readStore(key) {
            try { return JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { return {}; }
        }

        function writeStore(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
        }

        function leafKey(b, k, j) {
            return `${b.id}_${k}_${j}`;
        }

        function branchKeys(b) {
            return b.cats.flatMap((c, k) => c.items.map((_, j) => leafKey(b, k, j)));
        }

        function toggleLeaf(key) {
            completionMap[key] = !completionMap[key];
            const node = document.getElementById(`leaf-${key}`);
            if (node) node.classList.toggle("done", completionMap[key]);
            writeStore(STORAGE_KEY, completionMap);
            updateProgress();
        }

        function updateProgress() {
            let total = 0;
            let done = 0;
            MIND_DATA.forEach(b => {
                const keys = branchKeys(b);
                const d = keys.filter(k => completionMap[k]).length;
                total += keys.length;
                done += d;
                const el = document.getElementById(`prog-${b.id}`);
                if (el) el.textContent = `đã thuộc ${d}/${keys.length}`;
            });
            document.getElementById("progress-text").textContent = `Đã thuộc ${done}/${total}`;
        }

        function resetAllProgress() {
            if (!confirm("Xóa toàn bộ đánh dấu đã thuộc?")) return;
            completionMap = {};
            document.querySelectorAll(".leaf.done").forEach(n => n.classList.remove("done"));
            writeStore(STORAGE_KEY, completionMap);
            updateProgress();
        }

        function formatItem(text, color) {
            const m = text.match(/^([^:]{1,26}):\s(.+)$/);
            if (!m) return text;
            return `<b style="color:${color}">${m[1]}:</b> ${m[2]}`;
        }

        function renderMindmap() {
            const left = document.getElementById("side-left");
            const right = document.getElementById("side-right");
            left.innerHTML = "";
            right.innerHTML = "";

            MIND_DATA.forEach(b => {
                const catsHtml = b.cats.map((c, k) => {
                    const leaves = c.items.map((item, j) => {
                        const key = leafKey(b, k, j);
                        return `<div class="leaf ${completionMap[key] ? "done" : ""}" id="leaf-${key}"
                                     style="border-color:${b.color}" onclick="toggleLeaf('${key}')"><span class="leaf-text">${formatItem(item, b.color)}</span></div>`;
                    }).join("");
                    return `
                        <div class="cat-row">
                            ${c.items.length ? `<div class="leaves" id="leaves-${b.id}-${k}">${leaves}</div>` : ""}
                            ${c.label ? `<div class="cat" id="cat-${b.id}-${k}" style="color:${b.color}">${c.label}</div>` : ""}
                        </div>`;
                }).join("");

                const isCollapsed = !!collapsed[b.id];
                const html = `
                    <div class="branch ${isCollapsed ? "collapsed" : ""}" id="branch-${b.id}">
                        <div class="cats">${catsHtml}</div>
                        <div class="sec" id="sec-${b.id}" style="color:${b.color}" onclick="toggleBranch('${b.id}')" title="Bấm để thu gọn / mở rộng">
                            <svg class="doodle" viewBox="0 0 48 48">${DOODLES[b.doodle]}</svg>
                            <div class="sec-text">
                                <span class="sec-no">${b.no}</span><span class="sec-name">${b.title}</span>
                                <span class="sec-sub" id="prog-${b.id}"></span>
                            </div>
                            <span class="knob" id="knob-${b.id}">${isCollapsed ? "+" : "−"}</span>
                        </div>
                    </div>
                `;
                (b.side === "left" ? left : right).insertAdjacentHTML("beforeend", html);
            });

            updateProgress();
            updateCollapseButton();
        }

        function toggleBranch(id) {
            collapsed[id] = !collapsed[id];
            applyCollapse([id], !collapsed[id]);
        }

        function toggleAllBranches() {
            const anyOpen = MIND_DATA.some(b => !collapsed[b.id]);
            const changed = MIND_DATA.filter(b => !!collapsed[b.id] !== anyOpen).map(b => b.id);
            MIND_DATA.forEach(b => { collapsed[b.id] = anyOpen; });
            applyCollapse(changed, !anyOpen);
        }

        function applyCollapse(ids, expanding) {
            MIND_DATA.forEach(b => {
                document.getElementById(`branch-${b.id}`).classList.toggle("collapsed", !!collapsed[b.id]);
                document.getElementById(`knob-${b.id}`).textContent = collapsed[b.id] ? "+" : "−";
            });
            writeStore(COLLAPSE_KEY, collapsed);
            updateCollapseButton();
            syncSizer();
            drawBranches({ anim: expanding && !REDUCED_MOTION ? ids : null });
        }

        function updateCollapseButton() {
            const anyOpen = MIND_DATA.some(b => !collapsed[b.id]);
            document.getElementById("collapse-all-btn").textContent = anyOpen ? "Thu gọn hết" : "Mở hết";
        }

        function replayIntro() {
            document.getElementById("search-input").value = "";
            handleSearch();
            drawBranches({ anim: REDUCED_MOTION ? null : "all" });
        }

        function boxIn(el, root) {
            let x = 0;
            let y = 0;
            for (let e = el; e && e !== root; e = e.offsetParent) {
                x += e.offsetLeft;
                y += e.offsetTop;
            }
            return { left: x, right: x + el.offsetWidth, top: y, bottom: y + el.offsetHeight, cy: y + el.offsetHeight / 2 };
        }

        function wobble(seed) {
            const v = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
            return (v - Math.floor(v)) * 2 - 1;
        }

        function taperPath(x0, y0, x1, y1, w0, w1, seed) {
            const dx = (x1 - x0) * 0.5;
            const j = wobble(seed) * 8;
            const c1x = x0 + dx, c1y = y0 + j;
            const c2x = x1 - dx, c2y = y1 - j;
            const a = w0 * 0.8 / 2, b = w1 * 1.2 / 2;
            return `M ${x0} ${y0 - w0 / 2} C ${c1x} ${c1y - a}, ${c2x} ${c2y - b}, ${x1} ${y1 - w1 / 2}
                    L ${x1} ${y1 + w1 / 2} C ${c2x} ${c2y + b}, ${c1x} ${c1y + a}, ${x0} ${y0 + w0 / 2} Z`;
        }

        function pop(el, delay) {
            el.classList.remove("pop");
            void el.offsetWidth;
            el.style.animationDelay = `${delay}s`;
            el.classList.add("pop");
            el.addEventListener("animationend", () => {
                el.classList.remove("pop");
                el.style.animationDelay = "";
            }, { once: true });
        }

        function drawBranches(opts = {}) {
            const svg = document.getElementById("branches");
            const sheet = document.getElementById("sheet");
            const hub = document.getElementById("hub");
            const all = opts.anim === "all";
            const animIds = all ? null : (opts.anim || []);
            const parts = [];
            const pops = [];
            const h = boxIn(hub, sheet);
            let seed = 1;

            if (all) pops.push([hub, 0]);

            const pathTag = (d, color, extra, cls, delay) => {
                const anim = cls ? ` class="${cls}" style="animation-delay:${delay}s"` : "";
                return `<path d="${d}" fill="${color}"${extra}${anim}/>`;
            };

            MIND_DATA.forEach((b, i) => {
                const isLeft = b.side === "left";
                const growCls = isLeft ? "grow-l" : "grow-r";
                const animateBranch = all || animIds.includes(b.id);
                const t = all
                    ? { main: 0.3 + i * 0.07, cat: 0.85 + i * 0.07, leaf: 1.15 + i * 0.07 }
                    : { main: 0, cat: 0, leaf: 0.25 };

                const sEl = document.getElementById(`sec-${b.id}`);
                const s = boxIn(sEl, sheet);
                const sLine = s.bottom - 2.5;
                const hx = isLeft ? h.left + 24 : h.right - 24;
                const sInner = isLeft ? s.right : s.left;
                parts.push(pathTag(taperPath(hx, h.cy, sInner, sLine, 20, 5, seed++), b.color, "", all ? growCls : "", t.main));
                if (all) pops.push([sEl, t.main + 0.4]);

                const sOuter = isLeft ? s.left : s.right;
                b.cats.forEach((c, k) => {
                    const catDelay = t.cat + k * 0.07;
                    let fromX = sOuter;
                    let fromY = sLine;
                    let fromW = 5;

                    if (c.label) {
                        const cEl = document.getElementById(`cat-${b.id}-${k}`);
                        if (!cEl.offsetParent) return;
                        const cb = boxIn(cEl, sheet);
                        const cLine = cb.bottom - 1.5;
                        parts.push(pathTag(
                            taperPath(sOuter, sLine, isLeft ? cb.right : cb.left, cLine, 5, 3, seed++), b.color, "",
                            animateBranch ? growCls : "", catDelay
                        ));
                        if (animateBranch) pops.push([cEl, catDelay + 0.25]);
                        fromX = isLeft ? cb.left : cb.right;
                        fromY = cLine;
                        fromW = 3;
                    }

                    const leavesEl = document.getElementById(`leaves-${b.id}-${k}`);
                    if (!leavesEl || !leavesEl.offsetParent) return;
                    leavesEl.querySelectorAll(".leaf").forEach((leafEl, j) => {
                        const l = boxIn(leafEl, sheet);
                        const leafDelay = t.leaf + k * 0.08 + j * 0.03;
                        parts.push(pathTag(
                            taperPath(fromX, fromY, isLeft ? l.right : l.left, l.bottom - 1, fromW, 2, seed++), b.color, ` opacity="0.85"`,
                            animateBranch ? growCls : "", leafDelay
                        ));
                        if (animateBranch) pops.push([leafEl, leafDelay + 0.2]);
                    });
                });
            });

            svg.innerHTML = parts.join("");
            pops.forEach(([el, d]) => pop(el, d));
        }

        function syncSizer() {
            const sheet = document.getElementById("sheet");
            const sizer = document.getElementById("sizer");
            sizer.style.width = sheet.offsetWidth * currentScale + "px";
            sizer.style.height = sheet.offsetHeight * currentScale + "px";
        }

        function setScale(scale, anchor) {
            const vp = document.getElementById("viewport");
            const sheet = document.getElementById("sheet");
            const prev = currentScale;
            currentScale = Math.min(Math.max(MIN_SCALE, scale), MAX_SCALE);

            const ax = anchor ? anchor.x : vp.clientWidth / 2;
            const ay = anchor ? anchor.y : vp.clientHeight / 2;
            const cx = (vp.scrollLeft + ax) / prev;
            const cy = (vp.scrollTop + ay) / prev;

            sheet.style.transform = `scale(${currentScale})`;
            syncSizer();
            vp.scrollLeft = cx * currentScale - ax;
            vp.scrollTop = cy * currentScale - ay;
            document.getElementById("zoom-text").textContent = Math.round(currentScale * 100) + "%";
        }

        function zoomBy(delta) {
            setScale(Math.round((currentScale + delta) * 100) / 100);
        }

        function fitToScreen() {
            const vp = document.getElementById("viewport");
            const sheet = document.getElementById("sheet");
            setScale(Math.min(1, Math.floor((vp.clientWidth - 16) / sheet.offsetWidth * 100) / 100));
            vp.scrollLeft = 0;
            vp.scrollTop = 0;
        }

        function setupPanAndZoom() {
            const vp = document.getElementById("viewport");
            let pan = null;

            vp.addEventListener("mousedown", e => {
                if (e.button !== 0 || e.target.closest(".leaf, .sec")) return;
                pan = { x: e.clientX, y: e.clientY, left: vp.scrollLeft, top: vp.scrollTop };
                vp.classList.add("panning");
                e.preventDefault();
            });
            window.addEventListener("mousemove", e => {
                if (!pan) return;
                vp.scrollLeft = pan.left - (e.clientX - pan.x);
                vp.scrollTop = pan.top - (e.clientY - pan.y);
            });
            window.addEventListener("mouseup", () => {
                pan = null;
                vp.classList.remove("panning");
            });
            vp.addEventListener("wheel", e => {
                if (!e.ctrlKey) return;
                e.preventDefault();
                const r = vp.getBoundingClientRect();
                setScale(currentScale + (e.deltaY < 0 ? 0.08 : -0.08), { x: e.clientX - r.left, y: e.clientY - r.top });
            }, { passive: false });
        }

        function normalize(s) {
            return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d");
        }

        function handleSearch() {
            const q = normalize(document.getElementById("search-input").value.trim());
            let layoutChanged = false;

            MIND_DATA.forEach(b => {
                let branchHit = false;
                b.cats.forEach((c, k) => {
                    const catEl = document.getElementById(`cat-${b.id}-${k}`);
                    const catHit = !!q && !!catEl && normalize(catEl.textContent).includes(q);
                    let leafHit = false;
                    document.querySelectorAll(`#leaves-${b.id}-${k} .leaf`).forEach(n => {
                        const hit = !!q && (catHit || normalize(n.textContent).includes(q));
                        leafHit = leafHit || hit;
                        n.classList.toggle("match", hit && !catHit);
                        n.classList.toggle("dim", !!q && !hit);
                    });
                    if (catEl) catEl.classList.toggle("dim", !!q && !catHit && !leafHit);
                    branchHit = branchHit || catHit || leafHit;
                });

                const branch = document.getElementById(`branch-${b.id}`);
                const peek = branchHit && !!collapsed[b.id];
                if (branch.classList.contains("peek") !== peek) {
                    branch.classList.toggle("peek", peek);
                    layoutChanged = true;
                }
            });

            if (layoutChanged) {
                syncSizer();
                drawBranches();
            }
        }
    </script>
</body>
